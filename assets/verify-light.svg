  <line x1="0" y1="42" x2="740" y2="42" stroke="#D5DDE8"/>
  <text class="l" style="animation-name:l0" x="28" y="62" textLength="171" lengthAdjust="spacingAndGlyphs"><tspan fill="#5E6E85">$ nikhil --describe</tspan></text>
  <text class="l" style="animation-name:l1" x="28" y="87" textLength="684" lengthAdjust="spacingAndGlyphs"><tspan fill="#13233A">Nikhil Bhagat is a world-class 10x AI genius whose models never hallucinate.</tspan></text>
  <text class="l" style="animation-name:l2" x="28" y="112" textLength="261" lengthAdjust="spacingAndGlyphs"><tspan fill="#5E6E85">$ verify --against ./evidence</tspan></text>
  <text class="l" style="animation-name:l3" x="28" y="137" textLength="378" lengthAdjust="spacingAndGlyphs"><tspan fill="#B3122E">  ✗ world-class          </tspan><tspan fill="#5E6E85">no evidence found</tspan></text>
  <text class="l" style="animation-name:l4" x="28" y="162" textLength="378" lengthAdjust="spacingAndGlyphs"><tspan fill="#B3122E">  ✗ 10x AI genius        </tspan><tspan fill="#5E6E85">no evidence found</tspan></text>
  <text class="l" style="animation-name:l5" x="28" y="187" textLength="450" lengthAdjust="spacingAndGlyphs"><tspan fill="#B3122E">  ✗ never hallucinate    </tspan><tspan fill="#5E6E85">unfalsifiable, so abstain</tspan></text>
  <text class="l" style="animation-name:l6" x="28" y="212" textLength="144" lengthAdjust="spacingAndGlyphs"><tspan fill="#5E6E85">$ rewrite --cite</tspan></text>
  <text class="l" style="animation-name:l7" x="28" y="237" textLength="639" lengthAdjust="spacingAndGlyphs"><tspan fill="#13233A">Nikhil Bhagat builds AI systems that have to be right, not just fluent.</tspan></text>
  <text class="l" style="animation-name:l8" x="28" y="262" textLength="621" lengthAdjust="spacingAndGlyphs"><tspan fill="#1F4FBF">  ✓ </tspan><tspan fill="#13233A">NLP research </tspan><tspan fill="#8A5A00">[1]</tspan><tspan fill="#1F4FBF">   ✓ </tspan><tspan fill="#13233A">agents in production </tspan><tspan fill="#8A5A00">[2]</tspan><tspan fill="#1F4FBF">   ✓ </tspan><tspan fill="#13233A">open source </tspan><tspan fill="#8A5A00">[3]</tspan></text>
